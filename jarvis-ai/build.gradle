plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jarus.ai'
version = '1.0.0'
description = 'JARUS - AI-powered Job Hunt & Career Assistant'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudGcpVersion', '4.8.4')
}

dependencies {
	// Spring Boot Core
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Google Cloud - Firestore + Storage
	implementation 'com.google.cloud:spring-cloud-gcp-starter-data-firestore'
	implementation 'com.google.cloud:spring-cloud-gcp-starter-storage'

	// Gmail API
	implementation 'com.google.apis:google-api-services-gmail:v1-rev20220404-2.0.0'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.23.0'
	implementation 'com.google.http-client:google-http-client-jackson2:1.44.1'

	// Resume Parsing (PDF + DOCX)
	implementation 'org.apache.pdfbox:pdfbox:3.0.1'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'

	// Web Push Notifications (VAPID)
	implementation 'nl.martijndwars:web-push:5.1.1'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.77'

	// RSS Feed Parsing (Indeed jobs)
	implementation 'com.rometools:rome:2.1.0'

	// Rate Limiting
	implementation 'com.github.bucket4j:bucket4j-core:8.10.1'

	// JSON Structured Logging
	implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "com.google.cloud:spring-cloud-gcp-dependencies:${springCloudGcpVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootJar') {
	archiveFileName = 'jarus-ai.jar'
}
