name: Deploy JARUS to Cloud Run

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=""
          [ -z "${{ secrets.GCP_SA_KEY }}"              ] && missing="$missing GCP_SA_KEY"
          [ -z "${{ secrets.GCP_PROJECT_ID }}"          ] && missing="$missing GCP_PROJECT_ID"
          [ -z "${{ secrets.CLOUD_RUN_SERVICE_NAME }}"  ] && missing="$missing CLOUD_RUN_SERVICE_NAME"
          [ -z "${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}"  ] && missing="$missing GOOGLE_OAUTH_CLIENT_ID"
          [ -z "${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}"] && missing="$missing GOOGLE_OAUTH_CLIENT_SECRET"
          [ -z "${{ secrets.APP_ENCRYPTION_SECRET }}"   ] && missing="$missing APP_ENCRYPTION_SECRET"
          [ -z "${{ secrets.ADMIN_EMAIL }}"             ] && missing="$missing ADMIN_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo ""
            echo "Go to: Repo → Settings → Secrets and variables → Actions"
            echo "Add each missing secret listed above."
            echo "See README.md for the full setup guide."
            exit 1
          fi
          echo "All required secrets are present ✓"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
          region: asia-south1
          source: ./jarvis-ai
          flags: >-
            --min-instances=0
            --max-instances=2
            --memory=512Mi
            --cpu=1
            --timeout=300
            --allow-unauthenticated
            --set-env-vars=GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }},GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }},APP_ENCRYPTION_SECRET=${{ secrets.APP_ENCRYPTION_SECRET }},ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }},GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }},GOOGLE_CSE_API_KEY=${{ secrets.GOOGLE_CSE_API_KEY }},GOOGLE_CSE_ID=${{ secrets.GOOGLE_CSE_ID }},VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }},VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
