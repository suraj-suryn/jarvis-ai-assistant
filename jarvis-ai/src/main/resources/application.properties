spring.application.name=jarus-ai

# ==========================================
# Google OAuth2 - Sign In With Google
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile,https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.send,https://www.googleapis.com/auth/gmail.modify
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ==========================================
# Gemini AI
# ==========================================
gemini.model=gemini-1.5-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# ==========================================
# App Security
# ==========================================
app.encryption.secret=${APP_ENCRYPTION_SECRET}
admin.email=${ADMIN_EMAIL}

# ==========================================
# Database - PostgreSQL
# ==========================================
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==========================================
# File Storage - Cloudinary (free tier)
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==========================================
# Google Custom Search (company research)
# ==========================================
google.cse.api.key=${GOOGLE_CSE_API_KEY:}
google.cse.id=${GOOGLE_CSE_ID:}

# ==========================================
# VAPID Web Push Keys
# ==========================================
vapid.public.key=${VAPID_PUBLIC_KEY:}
vapid.private.key=${VAPID_PRIVATE_KEY:}

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# Actuator - health check for Render
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ==========================================
# Scheduling
# ==========================================
spring.task.scheduling.pool.size=5

# ==========================================
# Session
# ==========================================
server.servlet.session.timeout=8h

# ==========================================
# Logging
# ==========================================
logging.level.com.jarus.ai=INFO
