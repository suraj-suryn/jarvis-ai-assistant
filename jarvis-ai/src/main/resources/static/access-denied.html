<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JARUS — Access Denied</title>
  <link rel="stylesheet" href="/css/jarus.css"/>
  <meta name="theme-color" content="#060d1a"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .access-card {
      background: var(--card-bg, #0d1b2e);
      border: 1px solid var(--border, #1e3a5f);
      border-radius: 12px;
      padding: 2.5rem 3rem;
      text-align: center;
      max-width: 420px;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { color: var(--accent, #4fc3f7); margin: 0 0 0.75rem; font-size: 1.5rem; }
    p  { color: var(--text-muted, #8bacc8); margin: 0 0 1.5rem; line-height: 1.6; }
    .btn { display: inline-block; padding: 0.6rem 1.5rem; background: var(--accent, #4fc3f7);
           color: #060d1a; border-radius: 6px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="access-card">
    <div class="icon">🔒</div>
    <h1>Access Denied</h1>
    <p>Your account is not on the JARUS access list.<br/>
       Contact the administrator to request access.</p>
    <a href="/" class="btn">Back to Home</a>
  </div>
</body>
</html>
